# Builds a debug APK for on-device testing and uploads it as a run artifact
# (Actions → this run → Artifacts → planr-debug-<sha>). Runs on any branch push
# or PR that touches the app, and on demand via "Run workflow".
#
# Checks (unit tests, lint) live in ci.yml's `android` job; this one only
# produces an installable build.
#
# Repository configuration (Settings → Secrets and variables → Actions):
#   vars.PLANR_SUPABASE_URL, vars.PLANR_SUPABASE_ANON_KEY,
#   vars.PLANR_OAUTH_CLIENT_ID, vars.PLANR_WEB_ORIGIN (optional)
#     Baked into BuildConfig. All are public values; unset → the app shows its
#     "not configured" sign-in screen.
#   secrets.ANDROID_DEBUG_KEYSTORE_BASE64 (+ optional
#   secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD)
#     A shared debug keystore, base64-encoded. Without it every run signs with
#     a fresh throwaway key: installs over a previous build fail and the App
#     Link sign-in callback won't verify. See android/README.md.
name: Android debug APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The action's default `packages` includes the legacy "tools" package,
      # which current cmdline-tools no longer ship; name what the build uses.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Restore shared debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
            echo "PLANR_DEBUG_STORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway key (no in-place updates, App Link sign-in won't verify)."
          fi

      - name: Assemble debug APK
        env:
          PLANR_SUPABASE_URL: ${{ vars.PLANR_SUPABASE_URL }}
          PLANR_SUPABASE_ANON_KEY: ${{ vars.PLANR_SUPABASE_ANON_KEY }}
          PLANR_OAUTH_CLIENT_ID: ${{ vars.PLANR_OAUTH_CLIENT_ID }}
          PLANR_WEB_ORIGIN: ${{ vars.PLANR_WEB_ORIGIN }}
          PLANR_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          PLANR_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          PLANR_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name APK after the commit
        id: apk
        run: |
          sha="$(git rev-parse --short HEAD)"
          out="planr-debug-$sha.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "name=planr-debug-$sha" >> "$GITHUB_OUTPUT"
          echo "path=android/$out" >> "$GITHUB_OUTPUT"
          {
            echo "### Debug APK"
            echo "Download **planr-debug-$sha** from this run's Artifacts, unzip, then:"
            echo '```sh'
            echo "adb install -r $out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
