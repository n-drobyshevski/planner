# Planr for Android's version name, semver (MAJOR.MINOR.PATCH). Bump it by hand
# in the commit that starts a release:
#   PATCH  fixes only
#   MINOR  new features (a widget, a screen, a setting)
#   MAJOR  a breaking change for users (e.g. dropping an Android version)
# The version code is not kept here: it is the commit count (see
# build-logic's PlanrVersion.kt), so every build of a later commit installs
# over an earlier one.
VERSION_NAME=0.2.0
