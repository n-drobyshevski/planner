# Gradle / Kotlin / Android build settings for the Planr Android app.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Runtime config (Supabase URL, publishable key, OAuth client id, web origin) is
# NOT set here. Pass -PPLANR_SUPABASE_URL=... (or ~/.gradle/gradle.properties)
# or export PLANR_SUPABASE_URL etc. The build succeeds with them unset.
